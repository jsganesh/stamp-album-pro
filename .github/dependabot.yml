# Dependabot version updates: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Security updates are switched on separately, in the repository's settings.

version: 2
updates:
  # Python packages: pyproject.toml and uv.lock, updated together
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  # The actions used by the workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
