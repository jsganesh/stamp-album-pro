name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   python-version: "3.11" }
          - { os: macos-latest,   python-version: "3.13" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: ubuntu-24.04,  python-version: "3.10" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip uv
      - run: uv sync --extra dev --frozen --python "${{ matrix.python-version }}"
      - run: uv run --no-sync ruff check src
        continue-on-error: true
      - name: Install Chromium for the browser tests
        run: uv run --no-sync python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install Chromium for the browser tests
        run: uv run --no-sync python -m playwright install chromium
        if: runner.os != 'Linux'
      - run: uv run --no-sync python -m pytest src/tests/ --tb=short
        env:
          STAMP_ALBUM_REQUIRE_BROWSER: "1"

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: pip install build
      - run: python -m build --wheel
      - name: Wheel contains the web UI and no test code
        run: >
          python -c "import glob,zipfile; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist();
          assert any(x.endswith('web/index.html') for x in n), 'web assets missing';
          assert not any(x.startswith('tests/') for x in n), 'tests leaked into wheel'"
      - name: Install the wheel into a clean venv and import the app
        run: |
          python -m venv /tmp/wv
          /tmp/wv/bin/pip install dist/*.whl
          /tmp/wv/bin/python -c "import stamp_album.api"
