<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The master app icon. tools/make_icon.py renders it to StampAlbum.icns and .ico.
       Drawn on a 100-unit grid inside Apple's 824 px icon body (100 px margin), so macOS
       shows it as is instead of placing it on a grey tile. -->
  <defs>
    <!-- Round dots centred on the stamp's edge: the perforations. -->
    <style>
      .perf { fill: none; stroke: #141414; stroke-width: 2.1; stroke-linecap: round; stroke-dasharray: 0 2.7; }
      .corner { fill: #C9A227; }
    </style>
  </defs>
  <g transform="translate(100 100) scale(8.24)">
    <rect width="100" height="100" rx="22.5" fill="#8B1A1A"/>

    <!-- The exhibit sheet: ivory page, double border, heading. -->
    <rect x="19" y="11" width="62" height="78" rx="1.5" fill="#F6F1E6"/>
    <rect x="23.5" y="15.5" width="53" height="69" fill="none" stroke="#8B1A1A" stroke-width="1.6"/>
    <rect x="26.3" y="18.3" width="47.4" height="63.4" fill="none" stroke="#8B1A1A" stroke-width="0.7"/>
    <rect x="35" y="27" width="30" height="3.2" rx="1.6" fill="#2B2622"/>

    <!-- Left: a landscape stamp in a black mount, held by gold corners. -->
    <rect x="28" y="37" width="20" height="28" fill="#141414"/>
    <rect x="30.4" y="39.4" width="15.2" height="23.2" fill="#F6F1E6"/>
    <rect x="30.4" y="39.4" width="15.2" height="23.2" class="perf"/>
    <rect x="32.6" y="41.6" width="10.8" height="15" fill="#4A6B8A"/>
    <circle cx="40.4" cy="45.2" r="1.7" fill="#F2C14E"/>
    <path d="M32.6 56.6 V52.4 L36 49.4 L38.8 51.6 L41.4 48.8 L43.4 50.8 V56.6 Z" fill="#6F8F5E"/>
    <rect x="32.6" y="58" width="5" height="2.2" fill="#8B1A1A"/>
    <polygon points="28,37 33,37 28,42" class="corner"/>
    <polygon points="48,65 43,65 48,60" class="corner"/>

    <!-- Right: a ship stamp, same mount. -->
    <rect x="52" y="37" width="20" height="28" fill="#141414"/>
    <rect x="54.4" y="39.4" width="15.2" height="23.2" fill="#F6F1E6"/>
    <rect x="54.4" y="39.4" width="15.2" height="23.2" class="perf"/>
    <rect x="56.6" y="41.6" width="10.8" height="15" fill="#E3B54A"/>
    <rect x="56.6" y="53.2" width="10.8" height="3.4" fill="#4A6B8A"/>
    <polygon points="62,43.6 62,51.4 66,51.4" fill="#F6F1E6"/>
    <polygon points="61.2,45 61.2,51.4 58.2,51.4" fill="#F6F1E6"/>
    <path d="M57.8 52 H66.6 L65.2 54 H59.2 Z" fill="#8B1A1A"/>
    <rect x="61.4" y="43" width="0.6" height="9" fill="#2B2622"/>
    <rect x="62.4" y="58" width="5" height="2.2" fill="#8B1A1A"/>
    <polygon points="52,37 57,37 52,42" class="corner"/>
    <polygon points="72,65 67,65 72,60" class="corner"/>

    <!-- Caption lines: fade out at small sizes, which is fine. -->
    <rect x="31" y="69" width="14" height="1.6" rx="0.8" fill="#B9B0A0"/>
    <rect x="55" y="69" width="14" height="1.6" rx="0.8" fill="#B9B0A0"/>
  </g>
</svg>
